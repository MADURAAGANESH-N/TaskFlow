
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    # Dummy configuration for automated tests only.
    # Tests use an isolated SQLite database, not MySQL.
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: taskflow_db
      SECRET_KEY: "ci-test-only-key-never-use-in-production-1234567890"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v
